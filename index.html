<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minik Matematikçi - 1. Sınıf Testi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 relative overflow-hidden border-4 border-indigo-200">
        
        <!-- Başlık Bölümü -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">🧮 Minik Matematikçi</h1>
            <p class="text-sm text-gray-500">1. Sınıf Matematik Yolculuğu</p>
        </div>

        <!-- Ana Menü -->
        <div id="menu-screen" class="space-y-3">
            <button onclick="startQuiz('baslangic')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition transform active:scale-95 text-lg">
                🌱 1. Bölüm: Başlangıç (Sayılar & Şekiller)
            </button>
            <button onclick="startQuiz('orta')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition transform active:scale-95 text-lg">
                ⭐ 2. Bölüm: İşlemler (Toplama & Çıkarma)
            </button>
            <button onclick="startQuiz('bitis')" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition transform active:scale-95 text-lg">
                🚀 3. Bölüm: Yıl Sonu (Problemler & Zaman)
            </button>
            <button onclick="startQuiz('hepsi')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition transform active:scale-95 text-lg">
                🏆 Büyük Genel Sınav (Tüm Konular)
            </button>
        </div>

        <!-- Soru Ekranı -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-4 text-sm font-semibold text-gray-500">
                <span id="question-counter">Soru: 1/5</span>
                <button onclick="readQuestion()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1 rounded-full text-xs flex items-center gap-1">
                    🔊 Suyu Dinle
                </button>
            </div>

            <div class="bg-indigo-50 p-4 rounded-2xl mb-6 text-center">
                <h2 id="question-text" class="text-lg font-bold text-indigo-900">Soru metni buraya gelecek...</h2>
            </div>

            <div id="options-container" class="space-y-3">
                <!-- Şıklar buraya dinamik gelecektir -->
            </div>
        </div>

        <!-- Sonuç Ekranı -->
        <div id="result-screen" class="hidden text-center py-6">
            <div class="text-6xl mb-4" id="result-emoji">🎉</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Test Tamamlandı!</h2>
            <p id="result-score" class="text-lg text-indigo-600 font-semibold mb-6">Puanınız: 100</p>
            <button onclick="returnToMenu()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition w-full">
                🏠 Ana Menüye Dön
            </button>
        </div>

    </div>

    <script>
        // Soru Veritabanı (1. Sınıf Başlangıçtan Bitişe)
        const allQuestions = {
            baslangic: [
                { q: "8 sayısından sonra hangi sayı gelir?", options: ["7", "9", "10", "6"], answer: 1 },
                { q: "Aşağıdakilerden hangisi 20'ye kadar ritmik sayarken 5'erli saymada söylenmez?", options: ["5", "10", "12", "15"], answer: 2 },
                { q: "Hangi geometrik şeklin 4 kenarı ve 4 eşit köşesi vardır?", options: ["Üçgen", "Kare", "Çember", "Dikdörtgen"], answer: 1 },
                { q: "12 sayısının onluk ve birlik ayrılışı hangisidir?", options: ["1 onluk 2 birlik", "2 onluk 1 birlik", "10 onluk 2 birlik", "1 onluk 0 birlik"], answer: 0 },
                { q: "Aşağıdaki varlıklardan hangisi diğerlerinden daha uzundur?", options: ["Kalem", "Silgi", "Karınca", "Toplu İğne"], answer: 0 }
            ],
            orta: [
                { q: "7 + 6 işleminin sonucu kaçtır?", options: ["12", "13", "14", "15"], answer: 1 },
                { q: "16 - 7 işleminin sonucu kaçtır?", options: ["8", "9", "10", "11"], answer: 1 },
                { q: "Hangi toplama işleminin sonucu 14'e eşittir?", options: ["6 + 7", "8 + 6", "9 + 4", "7 + 8"], answer: 1 },
                { q: "Eksilen 18, çıkan 5 ise fark (kalan) kaçtır?", options: ["11", "12", "13", "14"], answer: 2 },
                { q: "Bir sepette 9 elma vardı, anne 6 elma daha koydu. Sepette kaç elma oldu?", options: ["13", "14", "15", "16"], answer: 2 }
            ],
            bitis: [
                { q: "Akrep 3'ü, yelkovan 12'yi gösteriyorsa saat kaçı gösteriyordur?", options: ["Saat 12:00", "Saat 03:00", "Saat 03:30", "Saat 12:03"], answer: 1 },
                { q: "Cebimde iki tane 10 TL vardır. Toplam kaç TL param vardır?", options: ["5 TL", "10 TL", "20 TL", "50 TL"], answer: 2 },
                { q: "Ali'nin 15 bilyesi vardı. 6 tanesini arkadaşına verdi. Ali'nin kaç bilyesi kaldı?", options: ["8", "9", "10", "11"], answer: 1 },
                { q: "Hangi ay ilkbahar mevsiminin aylarından biridir?", options: ["Ocak", "Temmuz", "Nisan", "Aralık"], answer: 2 },
                { q: "Haftanın 2. günü hangisidir?", options: ["Pazartesi", "Salı", "Çarşamba", "Perşembe"], answer: 1 }
            ]
        };

        let currentCategory = [];
        let currentIndex = 0;
        let score = 0;

        function startQuiz(categoryKey) {
            if (categoryKey === 'hepsi') {
                currentCategory = [...allQuestions.baslangic, ...allQuestions.orta, ...allQuestions.bitis];
            } else {
                currentCategory = [...allQuestions[categoryKey]];
            }
            currentIndex = 0;
            score = 0;

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= currentCategory.length) {
                showResult();
                return;
            }

            const qData = currentCategory[currentIndex];
            document.getElementById('question-counter').innerText = `Soru: ${currentIndex + 1} / ${currentCategory.length}`;
            document.getElementById('question-text').innerText = qData.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-white hover:bg-indigo-100 text-indigo-900 border-2 border-indigo-200 font-semibold py-3 px-4 rounded-2xl shadow-sm transition text-left flex items-center justify-between';
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}) ${opt}</span>`;
                btn.onclick = () => checkAnswer(idx, qData.answer, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex, buttonElement) {
            const buttons = document.getElementById('options-container').getElementsByTagName('button');
            
            // Tüm butonları devre dışı bırak
            for (let b of buttons) {
                b.disabled = true;
            }

            if (selectedIndex === correctIndex) {
                buttonElement.classList.remove('bg-white', 'border-indigo-200');
                buttonElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                score += 100 / currentCategory.length;
            } else {
                buttonElement.classList.remove('bg-white', 'border-indigo-200');
                buttonElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                // Doğru şıkkı yeşil yap
                buttons[correctIndex].classList.remove('bg-white', 'border-indigo-200');
                buttons[correctIndex].classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const roundedScore = Math.round(score);
            document.getElementById('result-score').innerText = `Toplam Puanınız: ${roundedScore}`;
            
            const emojiEl = document.getElementById('result-emoji');
            if (roundedScore >= 80) {
                emojiEl.innerText = "🏆";
            } else if (roundedScore >= 50) {
                emojiEl.innerText = "⭐";
            } else {
                emojiEl.innerText = "💪";
            }
        }

        function returnToMenu() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function readQuestion() {
            const text = document.getElementById('question-text').innerText;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
